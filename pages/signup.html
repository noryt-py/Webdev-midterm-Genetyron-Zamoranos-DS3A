<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Sign up | Kuha</title>
        <link rel="stylesheet" href="../src/css/style.css">
    </head>
<body data-page="signup" data-auth="guest" data-base="../"><main class="wrap">
<form id="f" class="panel"><h1>Join Kuha</h1>
<label for="dn">Display name</label><input id="dn" name="dn" maxlength="30" autocomplete="off">
<label for="user">Username</label><input id="user" name="user" required maxlength="20" autocomplete="off">
<label for="pw">Password</label><input id="pw" name="pw" type="password" required>
<p id="msg" class="err" role="alert"></p><button class="btn">Create account</button>
<p>Already a member? <a href="login.html">Log in</a></p></form>
</main><script src="../src/js/portfolio.js"></script>
<script src="../src/js/main.js"></script>
</body>
</html>
